name: Release

# Tagging `main` as vX.Y.Z publishes a GitHub Release: the notes since the last tag and the
# built site as a zip, for anyone who wants to host that version themselves.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CHANNEL: stable
          BUILD_SHA: ${{ github.sha }}

      - name: Zip the site
        run: (cd dist && zip -qr "../night-city-terminal-${GITHUB_REF_NAME}.zip" .)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Night City Terminal $GITHUB_REF_NAME" --generate-notes "night-city-terminal-${GITHUB_REF_NAME}.zip"
