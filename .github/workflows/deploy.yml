name: Test, build and deploy

# Two builds live on GitHub Pages: the stable release at the root, from `main`, and the beta
# under /beta/, from `beta`, with its own save. A push to either rebuilds both and deploys:
# the Pages environment only takes deployments from `main`, so a push to `beta` asks main's
# workflow to do it.
on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR runs replace each other; deploys queue up one after another and always finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # typecheck + production build into dist/
        env:
          CHANNEL: ${{ github.ref == 'refs/heads/beta' && 'beta' || 'stable' }}

  # A push to beta can't deploy from its own run: it starts this workflow on main, which builds both.
  redeploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      # The beta branch may not exist yet; then the site is the stable release alone.
      - id: beta
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: beta
          path: beta

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stable/package-lock.json

      - name: Build the stable release (the root)
        working-directory: stable
        run: |
          npm ci
          BUILD_SHA="$(git rev-parse HEAD)" CHANNEL=stable npm run build
          mkdir -p ../site
          cp -R dist/. ../site/

      - name: Build the beta (/beta/)
        if: steps.beta.outcome == 'success'
        working-directory: beta
        run: |
          npm ci
          BUILD_SHA="$(git rev-parse HEAD)" CHANNEL=beta npm run build
          mkdir -p ../site/beta
          cp -R dist/. ../site/beta/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
