<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#04050a" />
    <title>Night City Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div class="city-glow" aria-hidden="true"></div>
    <canvas id="weather" aria-hidden="true"></canvas>

    <div id="app">
      <header class="hud">
        <div class="hud-bar">
          <span id="hud-path">NCNET://</span>
          <span class="hud-right">
            <span id="hud-weather"></span>
            <span id="hud-clock"></span>
          </span>
        </div>
        <h1 id="hud-sign" class="sign"></h1>
      </header>

      <section id="scene" class="scene panel" aria-label="Location">
        <div class="scan-clip" aria-hidden="true"><div id="scan-beam" class="scan-beam"></div></div>
        <p id="scene-text" class="scene-text"></p>
      </section>

      <section id="map" class="map panel" aria-label="City map">
        <div class="map-head">
          <span class="map-title">City grid</span>
          <span id="map-progress" class="map-stat"></span>
          <button id="new-city" class="map-button" type="button">New city</button>
        </div>
        <div id="map-stage" class="map-stage">
          <div id="map-sweep" class="map-sweep" aria-hidden="true"></div>
          <div id="map-zones" class="map-zones" aria-hidden="true"></div>
          <svg id="map-routes" class="map-routes" aria-hidden="true"></svg>
          <nav id="map-nodes" class="map-nodes" aria-label="Places you can travel to"></nav>
          <div id="map-tracer" class="map-tracer" aria-hidden="true" hidden></div>
        </div>
        <div class="map-foot">
          <span id="map-seed"></span>
          <span id="map-coords"></span>
        </div>
      </section>

      <section class="feed" aria-label="Event feed">
        <div id="log" class="log"></div>
      </section>

      <div id="announcer" class="sr-only" aria-live="polite"></div>
    </div>

    <div id="flash" aria-hidden="true"></div>
    <div class="crt" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
