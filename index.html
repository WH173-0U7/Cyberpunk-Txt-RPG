<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#04050a" />
    <title>Night City Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div class="city-glow" aria-hidden="true"></div>
    <canvas id="weather" aria-hidden="true"></canvas>

    <div id="app">
      <header class="hud">
        <div class="hud-bar">
          <span id="hud-path">NCNET://</span>
          <span class="hud-right">
            <span id="hud-weather"></span>
            <span id="hud-clock"></span>
          </span>
        </div>
        <h1 id="hud-sign" class="sign"></h1>
        <div id="energy" class="energy" role="meter" aria-label="Energy" aria-valuemin="0">
          <span class="energy-label" aria-hidden="true">Energy</span>
          <span class="energy-bar" aria-hidden="true"><span id="energy-fill" class="energy-fill"></span></span>
          <span id="energy-value" class="energy-value" aria-hidden="true"></span>
          <span class="energy-foot" aria-hidden="true">
            <span id="energy-detail" class="energy-detail"></span>
            <span id="condition" class="condition"></span>
          </span>
        </div>
      </header>

      <section id="map" class="map panel" aria-label="City map">
        <div class="map-head">
          <button id="inventory-toggle" class="head-button" type="button" aria-controls="inventory" aria-expanded="false" aria-label="Inventory" title="Inventory (I)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z" /></svg>
            <span>Inventory</span>
          </button>
          <button id="settings-toggle" class="head-button is-icon" type="button" aria-controls="settings" aria-expanded="false" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.6" /><path d="M8 1v2.4M8 12.6V15M1 8h2.4M12.6 8H15M3 3l1.7 1.7M11.3 11.3 13 13M3 13l1.7-1.7M11.3 4.7 13 3" /></svg>
          </button>
          <span class="map-title">City grid</span>
          <span id="wallet" class="wallet"></span>
          <span id="map-progress" class="map-stat"></span>
          <span id="save-status" class="save-status">Saved</span>
        </div>
        <div id="map-stage" class="map-stage">
          <canvas id="map-city" class="map-city" aria-hidden="true"></canvas>
          <canvas id="map-fog" class="map-fog" aria-hidden="true"></canvas>
          <div id="map-names" class="map-names" aria-hidden="true"></div>
          <div id="map-sweep" class="map-sweep" aria-hidden="true"></div>
          <svg id="map-routes" class="map-routes" aria-hidden="true"></svg>
          <nav id="map-nodes" class="map-nodes" aria-label="Places you know about"></nav>
          <div id="map-player" class="player" aria-hidden="true"><span class="player-mark"></span></div>
          <div id="transmissions" class="transmissions" aria-hidden="true"></div>
          <div id="map-zoom" class="map-zoom" role="group" aria-label="Map zoom">
            <button id="zoom-in" class="zoom-button" type="button" aria-label="Zoom in" title="Zoom in">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" /></svg>
            </button>
            <button id="zoom-out" class="zoom-button" type="button" aria-label="Zoom out" title="Zoom out">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12" /></svg>
            </button>
            <button id="zoom-home" class="zoom-button" type="button" aria-label="Find yourself on the map" title="Find yourself">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.5" /><path d="M8 0.5v3M8 12.5v3M0.5 8h3M12.5 8h3" /></svg>
            </button>
          </div>
        </div>
        <div id="inventory" class="overlay inventory" role="dialog" aria-labelledby="inventory-title" hidden>
          <div class="overlay-strip">
            <span class="overlay-barcode" aria-hidden="true"></span>
            <span id="inventory-title" class="overlay-label">NCNET//INV</span>
            <span id="inventory-total" class="overlay-detail"></span>
            <button id="inventory-close" class="icon-btn overlay-close" type="button" aria-label="Close inventory" title="Close (Esc)"></button>
          </div>
          <div class="overlay-body">
            <p class="inventory-pass">NCART pass <span id="inventory-pass"></span></p>
            <ul id="inventory-sections" class="inventory-sections"></ul>
          </div>
        </div>
        <div id="settings" class="overlay settings" role="dialog" aria-labelledby="settings-title" hidden>
          <div class="overlay-strip">
            <span class="overlay-barcode" aria-hidden="true"></span>
            <span id="settings-title" class="overlay-label">NCNET//SYS</span>
            <span id="settings-seed" class="overlay-detail"></span>
            <button id="settings-close" class="icon-btn overlay-close" type="button" aria-label="Close settings" title="Close (Esc)"></button>
          </div>
          <div class="overlay-body">
            <section class="settings-group" aria-labelledby="settings-save">
              <h3 id="settings-save" class="settings-label">Save</h3>
              <p class="settings-note">Your progress saves on this device as you play. <span id="settings-progress"></span></p>
              <div class="settings-actions">
                <button id="settings-restart" class="danger-button" type="button" aria-controls="settings-confirm" aria-expanded="false">
                  <span class="danger-label">Restart this city</span>
                  <span class="danger-sub">Same city, all progress back to the start</span>
                </button>
                <button id="settings-erase" class="danger-button" type="button" aria-controls="settings-confirm" aria-expanded="false">
                  <span class="danger-label">Erase save</span>
                  <span class="danger-sub">Delete it from this device and start a new city</span>
                </button>
              </div>
              <div id="settings-confirm" class="settings-confirm" role="group" aria-labelledby="settings-confirm-text" hidden>
                <p id="settings-confirm-text"></p>
                <div class="settings-confirm-actions">
                  <button id="settings-confirm-no" class="action" type="button">Cancel</button>
                  <button id="settings-confirm-yes" class="danger-button is-solid" type="button"></button>
                </div>
              </div>
            </section>
          </div>
        </div>
        <div id="people" class="overlay people" role="dialog" aria-labelledby="people-title" hidden>
          <div class="overlay-strip">
            <span class="overlay-barcode" aria-hidden="true"></span>
            <span id="people-title" class="overlay-label">NCNET//PEOPLE</span>
            <span id="people-count" class="overlay-detail"></span>
            <button id="people-close" class="icon-btn overlay-close" type="button" aria-label="Close" title="Close (Esc)"></button>
          </div>
          <div class="overlay-body">
            <p id="people-rep" class="people-rep" hidden></p>
            <p id="people-empty" class="people-empty" hidden></p>
            <ul id="people-list" class="people-list"></ul>
            <div id="people-known" class="person-gifts people-known" hidden></div>
            <div id="person" class="person-card" hidden>
              <div class="person-head">
                <button id="person-back" class="person-back" type="button" aria-label="Everyone here" title="Everyone here">‹</button>
                <div class="person-head-row">
                  <h3 id="person-name" class="person-name"></h3>
                  <span id="person-stance" class="stance"></span>
                </div>
                <p id="person-kicker" class="person-kicker"></p>
                <button id="person-facts" class="person-facts" type="button" aria-expanded="false" title="What you know"></button>
              </div>
              <div id="person-web" class="person-web-box" hidden></div>
              <ol id="person-log" class="person-log" aria-label="What was said" aria-live="polite"></ol>
              <div id="person-picker" class="person-picker" hidden></div>
              <div id="person-commands" class="person-commands" role="toolbar" aria-label="What to do"></div>
            </div>
          </div>
        </div>
        <div id="shop" class="overlay shop" role="dialog" aria-labelledby="shop-title" hidden>
          <div class="overlay-strip">
            <span class="overlay-barcode" aria-hidden="true"></span>
            <span id="shop-title" class="overlay-label">NCNET//MENU</span>
            <span id="shop-kicker" class="overlay-detail"></span>
            <button id="shop-close" class="icon-btn overlay-close" type="button" aria-label="Close the menu" title="Close (Esc)"></button>
          </div>
          <div class="overlay-body">
            <p id="shop-blurb" class="shop-blurb"></p>
            <p id="shop-status" class="shop-status" role="status"></p>
            <ul id="shop-list" class="shop-list"></ul>
          </div>
        </div>
        <div id="bank" class="overlay bank" role="dialog" aria-labelledby="bank-title" hidden>
          <div class="overlay-strip">
            <span class="overlay-barcode" aria-hidden="true"></span>
            <span id="bank-title" class="overlay-label">NCNET//BANK</span>
            <span id="bank-name" class="overlay-detail"></span>
            <button id="bank-close" class="icon-btn overlay-close" type="button" aria-label="Leave the counter" title="Close (Esc)"></button>
          </div>
          <div class="overlay-body bank-body">
            <div id="bank-figures" class="bank-figures"></div>
            <p id="bank-status" class="shop-status" role="status"></p>
            <div id="bank-picker" class="person-picker" hidden></div>
            <div id="bank-commands" class="person-commands" role="toolbar" aria-label="The counter"></div>
          </div>
        </div>
        <div id="place" class="place">
          <div class="scan-clip" aria-hidden="true"><div id="scan-beam" class="scan-beam"></div></div>
          <div class="place-text">
            <p id="place-kicker" class="place-kicker"></p>
            <h2 id="place-title" class="place-title" hidden></h2>
            <p id="place-meta" class="place-meta" hidden></p>
            <p id="place-desc" class="place-desc"></p>
            <div id="place-progress" class="place-progress" hidden><div class="place-progress-bar"></div></div>
          </div>
          <div id="place-actions" class="place-actions" hidden>
            <button id="act-walk" class="action" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-ride" class="action is-ncart" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-pass" class="action is-ncart" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-stop" class="action is-stop" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-people" class="action is-people" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-menu" class="action is-menu" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-bank" class="action is-bank" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-enter" class="action" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
            <button id="act-leave" class="action" type="button"><span class="action-label"></span><span class="action-sub"></span></button>
          </div>
          <button id="place-close" class="icon-btn place-close" type="button" aria-label="Back to where you are" hidden></button>
        </div>
        <div class="map-foot">
          <span id="map-seed"></span>
          <span id="map-coords"></span>
        </div>
      </section>

      <div id="announcer" class="sr-only" aria-live="polite"></div>
    </div>

    <div id="flash" aria-hidden="true"></div>
    <div class="crt" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
